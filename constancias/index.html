<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Constancias — Dr. Manuel Salinas</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js" async defer></script>
<style>
/* MS-UI:INICIO */
/* Estilo común de las apps (diseño «C»: estructura Consultorio, colores Clínico).
   Fuente única: shared/ms-ui.css. scripts/sync-ui.py lo copia dentro de cada app entre
   los marcadores MS-UI:INICIO / MS-UI:FIN (cada app es un solo archivo y funciona sin conexión). */
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&display=swap');
:root{
  --ms-bg:#F1F5F9;
  --ms-surface:#FFFFFF;
  --ms-surface-2:#F8FAFC;
  --ms-line:#E2E8F0;
  --ms-line-strong:#CBD5E1;
  --ms-ink:#0F172A;
  --ms-ink-2:#334155;
  --ms-muted:#3B4A5E;
  --ms-faint:#94A3B8;
  --ms-accent:#0F766E;
  --ms-accent-hover:#115E59;
  --ms-accent-soft:#CCFBF1;
  --ms-accent-ink:#115E59;
  --ms-warn-bg:#FFFBEB;
  --ms-warn-line:#FCD34D;
  --ms-warn-ink:#78350F;
  --ms-ok-bg:#D1FAE5;
  --ms-ok-ink:#065F46;
  --ms-danger:#B91C1C;
  --ms-danger-bg:#FEF2F2;
  --ms-radius-card:18px;
  --ms-radius-field:12px;
  --ms-pill:999px;
  --ms-shadow:0 1px 2px rgba(15,23,42,.06), 0 4px 14px rgba(15,23,42,.05);
  --ms-shadow-up:0 -6px 18px rgba(15,23,42,.06);
  --ms-font:'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
.ms-app{font-family:var(--ms-font);font-weight:450;color:var(--ms-ink);background:var(--ms-bg);-webkit-tap-highlight-color:transparent;}
.ms-app *{box-sizing:border-box;}
.ms-app button,.ms-app input,.ms-app select,.ms-app textarea{font-family:inherit;}

/* Encabezado */
.ms-header{background:var(--ms-surface);display:flex;align-items:center;gap:12px;padding:12px 16px 10px;}
.ms-mark{width:38px;height:38px;border-radius:50%;background:var(--ms-accent);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;}
.ms-mark svg{width:19px;height:19px;}
.ms-titles{flex:1;min-width:0;}
.ms-title{font-size:18px;font-weight:650;letter-spacing:-.02em;line-height:1.2;margin:0;color:var(--ms-ink);}
.ms-sub{font-size:13px;color:var(--ms-muted);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ms-iconbtn{width:44px;height:44px;border-radius:50%;border:none;background:var(--ms-bg);color:var(--ms-accent);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;}
.ms-iconbtn:hover{background:var(--ms-line);}
.ms-iconbtn svg{width:20px;height:20px;}
.ms-chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--ms-pill);border:1px solid var(--ms-line);background:var(--ms-surface);color:var(--ms-muted);font-size:13.5px;font-weight:500;cursor:pointer;white-space:nowrap;}
.ms-chip .ms-dot{width:8px;height:8px;border-radius:50%;background:var(--ms-faint);}
.ms-chip.on{background:var(--ms-accent-soft);border-color:var(--ms-accent-soft);color:var(--ms-accent-ink);}
.ms-chip.on .ms-dot{background:var(--ms-accent);}

/* Pestañas tipo píldora */
.ms-tabsbar{background:var(--ms-surface);padding:0 12px 10px;border-bottom:1px solid var(--ms-line);}
.ms-tabs{background:var(--ms-bg);border-radius:var(--ms-pill);padding:4px;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;}
.ms-tab{height:38px;border-radius:var(--ms-pill);border:none;background:transparent;color:var(--ms-muted);font-size:14px;font-weight:500;cursor:pointer;padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ms-tab:hover{color:var(--ms-ink);}
.ms-tab[aria-current="page"]{background:var(--ms-accent);color:#fff;font-weight:600;box-shadow:0 1px 3px rgba(15,23,42,.15);}

/* Títulos y tarjetas */
.ms-section-title{margin:0 4px 8px;font-size:14px;font-weight:650;color:var(--ms-accent);}
.ms-card{background:var(--ms-surface);border-radius:var(--ms-radius-card);box-shadow:var(--ms-shadow);padding:16px;}
.ms-list{background:var(--ms-surface);border-radius:var(--ms-radius-card);box-shadow:var(--ms-shadow);overflow:hidden;}
.ms-row{width:100%;border:none;background:transparent;text-align:left;color:var(--ms-ink);min-height:56px;padding:10px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;border-bottom:1px solid var(--ms-bg);text-decoration:none;}
.ms-row:last-child{border-bottom:none;}
.ms-row:hover{background:var(--ms-surface-2);}
.ms-row[aria-current="true"]{background:var(--ms-accent);color:#fff;}
.ms-row[aria-current="true"] .ms-row-d{color:#CCFBF1;}
.ms-row[aria-current="true"] .ms-badge-n{background:rgba(255,255,255,.18);color:#fff;}
.ms-badge-n{min-width:34px;height:34px;padding:0 6px;border-radius:10px;background:var(--ms-accent-soft);color:var(--ms-accent-ink);font-size:12.5px;font-weight:650;display:flex;align-items:center;justify-content:center;flex:none;}
.ms-row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.ms-row-t{font-size:15.5px;font-weight:600;line-height:1.3;}
.ms-row-d{font-size:13px;color:var(--ms-muted);line-height:1.35;}
.ms-chev{flex:none;color:var(--ms-faint);}

/* Campos */
.ms-label{display:block;font-size:13px;font-weight:500;color:var(--ms-muted);margin-bottom:5px;}
.ms-input{width:100%;min-height:46px;border-radius:var(--ms-radius-field);border:1px solid var(--ms-line-strong);background:var(--ms-surface-2);padding:10px 14px;font-size:16px;color:var(--ms-ink);}
.ms-input:focus{outline:2px solid var(--ms-accent);outline-offset:1px;border-color:var(--ms-accent);background:#fff;}
.ms-search{position:relative;}
.ms-search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:#64748B;pointer-events:none;}
.ms-search input{width:100%;height:48px;border-radius:var(--ms-pill);border:1px solid var(--ms-line-strong);background:var(--ms-surface);padding:0 16px 0 42px;font-size:16px;color:var(--ms-ink);}
.ms-search input:focus{outline:2px solid var(--ms-accent);outline-offset:1px;}
.ms-seg{background:var(--ms-bg);border-radius:var(--ms-radius-field);padding:3px;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:3px;}
.ms-seg button{height:40px;border-radius:10px;border:none;background:transparent;color:var(--ms-muted);font-size:15px;font-weight:500;cursor:pointer;}
.ms-seg button[aria-pressed="true"]{background:var(--ms-accent);color:#fff;font-weight:600;}

/* Botones */
.ms-btn{min-height:48px;padding:0 20px;border-radius:var(--ms-pill);border:1px solid transparent;font-size:16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;}
.ms-btn-primary{background:var(--ms-accent);color:#fff;box-shadow:0 4px 12px rgba(15,118,110,.28);}
.ms-btn-primary:hover{background:var(--ms-accent-hover);}
.ms-btn-secondary{background:var(--ms-surface);border-color:var(--ms-line-strong);color:var(--ms-ink);}
.ms-btn-secondary:hover{background:var(--ms-surface-2);}
.ms-btn-ghost{background:transparent;color:var(--ms-accent);}
.ms-btn-danger{background:var(--ms-surface);border-color:var(--ms-line);color:var(--ms-danger);min-height:32px;padding:0 12px;font-size:13.5px;font-weight:500;}
.ms-btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none;}

/* Barra de acciones fija abajo (celular) */
.ms-actionbar{position:sticky;bottom:0;z-index:20;background:var(--ms-surface);border-top:1px solid var(--ms-line);box-shadow:var(--ms-shadow-up);padding:12px 14px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;}
.ms-actionbar>*{flex:1;}

/* Avisos */
.ms-banner{border-radius:var(--ms-radius-field);padding:10px 14px;font-size:14px;line-height:1.45;}
.ms-banner-warn{background:var(--ms-warn-bg);color:var(--ms-warn-ink);}
.ms-banner-ok{background:var(--ms-ok-bg);color:var(--ms-ok-ink);}
.ms-badge{display:inline-flex;align-items:center;border-radius:var(--ms-pill);padding:4px 10px;font-size:13px;font-weight:600;}
.ms-badge-ok{background:var(--ms-ok-bg);color:var(--ms-ok-ink);}
.ms-toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ms-ink);color:#fff;padding:11px 18px;border-radius:var(--ms-pill);font-size:14px;box-shadow:var(--ms-shadow);z-index:60;max-width:90%;text-align:center;}

/* Íconos de línea (en lugar de emojis). Uso: class="ms-i ms-i-print" en el botón; el ícono va antes del texto. */
.ms-i::before{content:"";display:inline-block;width:1.15em;height:1.15em;margin-right:.45em;vertical-align:-.2em;background:currentColor;-webkit-mask:var(--ms-ico) center/contain no-repeat;mask:var(--ms-ico) center/contain no-repeat;flex:none;}
.ms-i:empty::before{margin-right:0;}
.ms-svg{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none;}

/* Panel de hoja membretada (shared/ms-membrete.js) */
.ms-memb .ms-seg{margin-bottom:12px;}
.ms-memb-fila{display:flex;gap:14px;align-items:flex-start;margin-bottom:12px;}
.ms-memb-mini{position:relative;flex:none;width:118px;aspect-ratio:8.5/11;border:1px solid var(--ms-line-strong);border-radius:6px;overflow:hidden;background:#fff;}
.ms-memb-mini img{width:100%;height:100%;display:block;}
.ms-memb-zona{position:absolute;left:0;right:0;background:rgba(15,118,110,.16);border:0 dashed var(--ms-accent);}
.ms-memb-zona:first-of-type{border-bottom-width:1.5px;}
.ms-memb-zona:last-of-type{border-top-width:1.5px;}
.ms-memb-campos{flex:1;min-width:0;}
.ms-memb-nota{font-size:13px;color:var(--ms-muted);line-height:1.45;margin-bottom:10px;}
.ms-memb-botones{display:flex;gap:10px;margin-bottom:10px;}
.ms-memb-error{font-size:13.5px;color:var(--ms-danger);}
.ms-memb-error:empty{display:none;}

/* Computadora: lista a la izquierda, contenido al centro */
@media (min-width:1024px){
  .ms-header{padding:14px 28px;}
  .ms-tabsbar{padding:0 28px 12px;}
  .ms-tabs{max-width:520px;}
  .ms-split{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;align-items:start;}
  .ms-split>aside{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;padding-bottom:16px;}
  .ms-actionbar{position:static;box-shadow:none;border-top:none;background:transparent;padding:16px 0 0;justify-content:flex-end;}
  .ms-actionbar>*{flex:0 1 220px;}
}

<script>
'use strict';
/* MS-MEMBRETE:INICIO */
/* Hoja membretada común a las apps que hacen documentos (Constancias y Alta Quirúrgica).
   Fuente única: shared/ms-membrete.js. scripts/sync-ui.py la copia dentro de cada app entre
   los marcadores MS-MEMBRETE:INICIO / MS-MEMBRETE:FIN.
   La imagen se guarda solo en el aparato (localStorage). Las apps están en la misma dirección web,
   así que la hoja que se carga en una sirve también para la otra. Nunca va en el código publicado. */
const MS_MEMB = { img:'ms_membrete', on:'ms_membrete_on', marg:'ms_membrete_margenes' };
const MS_MEMB_DPI = 150, MS_MEMB_W = 1275, MS_MEMB_H = 1650; // carta a 150 ppp

function msMembLeer(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function msMembEscribir(k, v){ try{ if(v===null) localStorage.removeItem(k); else localStorage.setItem(k, v); return true; }catch(e){ return false; } }

/* Hoja guardada en este aparato (o null). */
function msMembreteGuardado(){
  const img = msMembLeer(MS_MEMB.img);
  if(!img) return null;
  let m = {};
  try{ m = JSON.parse(msMembLeer(MS_MEMB.marg) || '{}'); }catch(e){}
  return { img, top: m.top || 1.8, bottom: m.bottom || 1.4 };
}
/* Hoja que se debe usar en los documentos: solo si hay una guardada y está elegida. */
function msMembrete(){
  return msMembLeer(MS_MEMB.on) === '1' ? msMembreteGuardado() : null;
}

/* Calcula dónde termina el encabezado y dónde empieza el pie. Busca renglones con tinta oscura;
   el dibujo de fondo de color claro (marca de agua) no cuenta. Devuelve pulgadas de margen. */
function msMembreteDetectar(ctx, W, H){
  const datos = ctx.getImageData(0, 0, W, H).data;
  const oscuro = new Array(H).fill(false);
  for(let y = 0; y < H; y++){
    let n = 0;
    for(let x = 0; x < W; x++){
      const i = (y*W + x)*4;
      const lum = 0.299*datos[i] + 0.587*datos[i+1] + 0.114*datos[i+2];
      if(lum < 170 && ++n > 2){ oscuro[y] = true; break; }
    }
  }
  let finEnc = -1, iniPie = H;
  for(let y = 0; y < H*0.35; y++) if(oscuro[y]) finEnc = y;
  for(let y = H-1; y > H*0.65; y--) if(oscuro[y]) iniPie = y;
  const dpi = H/11;
  const top = finEnc < 0 ? 0.9 : Math.max(0.9, finEnc/dpi + 0.3);
  const bottom = iniPie >= H ? 0.8 : Math.max(0.8, (H - iniPie)/dpi + 0.25);
  return { top: Math.round(top*100)/100, bottom: Math.round(bottom*100)/100 };
}

/* Carga una imagen (PNG o JPG), la lleva a tamaño carta, calcula los márgenes y la guarda. */
function msMembreteCargar(file){
  return new Promise((resolve, reject)=>{
    if(!file || !/^image\/(png|jpe?g)$/.test(file.type)){ reject(new Error('Use una imagen PNG o JPG. Si su hoja está en Word o PDF, conviértala primero a imagen.')); return; }
    const fr = new FileReader();
    fr.onerror = ()=>reject(new Error('No se pudo leer el archivo.'));
    fr.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('No se pudo abrir la imagen.'));
      img.onload = ()=>{
        const c = document.createElement('canvas'); c.width = MS_MEMB_W; c.height = MS_MEMB_H;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, MS_MEMB_W, MS_MEMB_H);
        ctx.drawImage(img, 0, 0, MS_MEMB_W, MS_MEMB_H);
        const m = msMembreteDetectar(ctx, MS_MEMB_W, MS_MEMB_H);
        const url = c.toDataURL('image/jpeg', 0.85);
        if(!msMembEscribir(MS_MEMB.img, url)){ reject(new Error('No hay espacio en este aparato para guardar la hoja. Pruebe con una imagen más liviana.')); return; }
        msMembEscribir(MS_MEMB.marg, JSON.stringify(m));
        msMembEscribir(MS_MEMB.on, '1');
        const proporcion = img.width / img.height, carta = 8.5/11;
        resolve({ margenes: m, aviso: Math.abs(proporcion - carta) > 0.04 ? 'La imagen no tiene la proporción de una hoja carta; se estiró para llenarla. Revise un documento antes de usarla.' : '' });
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function msMembreteRecalcular(){
  const g = msMembreteGuardado(); if(!g) return Promise.resolve(null);
  return new Promise(resolve=>{
    const img = new Image();
    img.onload = ()=>{
      const c = document.createElement('canvas'); c.width = MS_MEMB_W; c.height = MS_MEMB_H;
      const ctx = c.getContext('2d'); ctx.drawImage(img, 0, 0, MS_MEMB_W, MS_MEMB_H);
      const m = msMembreteDetectar(ctx, MS_MEMB_W, MS_MEMB_H);
      msMembEscribir(MS_MEMB.marg, JSON.stringify(m)); resolve(m);
    };
    img.onerror = ()=>resolve(null);
    img.src = g.img;
  });
}

/* Panel de ajustes, igual en las dos apps. */
function msMembretePanelHTML(){
  const g = msMembreteGuardado(), usar = !!msMembrete();
  const cm = v => (Math.round(v*2.54*10)/10).toString();
  return `
  <div class="ms-memb">
    <div class="ms-label" style="font-size:14px;color:var(--ms-ink);margin-bottom:8px;">Qué usar como encabezado de los documentos</div>
    <div class="ms-seg" role="group" aria-label="Qué usar como encabezado">
      <button type="button" id="msMembDatos" aria-pressed="${!usar}">Datos del médico</button>
      <button type="button" id="msMembHoja" aria-pressed="${usar}">Hoja membretada</button>
    </div>
    ${g ? `
    <div class="ms-memb-fila">
      <div class="ms-memb-mini" aria-hidden="true">
        <img src="${g.img}" alt="">
        <span class="ms-memb-zona" style="top:0;height:${g.top/11*100}%"></span>
        <span class="ms-memb-zona" style="bottom:0;height:${g.bottom/11*100}%"></span>
      </div>
      <div class="ms-memb-campos">
        <div class="ms-memb-nota">El texto va en el espacio blanco del centro. Lo sombreado queda libre para su encabezado y su pie.</div>
        <label class="ms-label" for="msMembTop">Espacio para el encabezado (cm)</label>
        <input class="ms-input" type="number" id="msMembTop" min="1" max="10" step="0.1" inputmode="decimal" value="${cm(g.top)}">
        <label class="ms-label" for="msMembBot" style="margin-top:8px;">Espacio para el pie (cm)</label>
        <input class="ms-input" type="number" id="msMembBot" min="1" max="10" step="0.1" inputmode="decimal" value="${cm(g.bottom)}">
        <button type="button" class="ms-btn ms-btn-ghost" id="msMembAuto" style="min-height:36px;padding:0;margin-top:6px;">Calcular de nuevo</button>
      </div>
    </div>` : `
    <div class="ms-memb-nota" style="margin-top:10px;">Cargue su hoja membretada como imagen PNG o JPG de tamaño carta. La app calcula sola dónde termina el encabezado y dónde empieza el pie.</div>`}
    <div class="ms-memb-botones">
      <label class="ms-btn ms-btn-secondary" for="msMembFile" style="flex:1;">${g ? 'Cambiar hoja' : 'Cargar hoja'}</label>
      <input type="file" id="msMembFile" accept="image/png,image/jpeg" hidden>
      ${g ? `<button type="button" class="ms-btn ms-btn-danger" id="msMembQuitar" style="min-height:48px;">Quitar hoja</button>` : ''}
    </div>
    <div class="ms-memb-nota">Se guarda solo en este aparato y sirve para Constancias y Alta Quirúrgica. En otro teléfono o computadora hay que cargarla otra vez.</div>
    <div class="ms-memb-error" id="msMembMsg" role="status"></div>
  </div>`;
}
/* Conecta los botones del panel. alCambiar() vuelve a dibujar la pantalla de la app. */
function msMembreteConectar(alCambiar, avisar){
  const $ = id => document.getElementById(id);
  const msg = t => { const el = $('msMembMsg'); if(el) el.textContent = t || ''; };
  if(!$('msMembHoja')) return;
  $('msMembDatos').onclick = ()=>{ msMembEscribir(MS_MEMB.on, '0'); alCambiar(); };
  $('msMembHoja').onclick = ()=>{
    if(!msMembreteGuardado()){ $('msMembFile').click(); return; }
    msMembEscribir(MS_MEMB.on, '1'); alCambiar();
  };
  $('msMembFile').onchange = async e=>{
    const f = e.target.files && e.target.files[0]; if(!f) return;
    try{
      const r = await msMembreteCargar(f);
      alCambiar();
      if(avisar) avisar(r.aviso || 'Hoja membretada guardada');
    }catch(err){ msg(err.message); }
  };
  const guardarMargen = ()=>{
    const t = parseFloat($('msMembTop').value), b = parseFloat($('msMembBot').value);
    if(!(t >= 1 && t <= 10 && b >= 1 && b <= 10)){ msg('Use valores entre 1 y 10 cm.'); return; }
    msMembEscribir(MS_MEMB.marg, JSON.stringify({ top: Math.round(t/2.54*100)/100, bottom: Math.round(b/2.54*100)/100 }));
    alCambiar();
  };
  if($('msMembTop')){ $('msMembTop').onchange = guardarMargen; $('msMembBot').onchange = guardarMargen; }
  if($('msMembAuto')) $('msMembAuto').onclick = async ()=>{ await msMembreteRecalcular(); alCambiar(); };
  if($('msMembQuitar')) $('msMembQuitar').onclick = ()=>{
    const b = $('msMembQuitar');
    if(b.dataset.confirmar !== '1'){ b.dataset.confirmar = '1'; b.textContent = 'Toque otra vez para quitar'; return; }
    msMembEscribir(MS_MEMB.img, null); msMembEscribir(MS_MEMB.marg, null); msMembEscribir(MS_MEMB.on, '0');
    alCambiar(); if(avisar) avisar('Hoja membretada quitada');
  };
}

  } else {

function consentBody(c, d){
  const valores = {
    fecha: fmtFechaCorta(d.__fecha) || fmtFechaCorta(todayISO()),
    expediente: enBlanco(d.expediente, 16), hora: d.hora ? fmtHora12(d.hora) : enBlanco('', 10),
    nombre: enBlanco(d.nombre, 34), dni: enBlanco(d.documentoIdentidad, 18),
    edad: d.edad ? d.edad+' años' : enBlanco('', 6), sexo: enBlanco(d.sexo, 10), medico: enBlanco(d.medicoNombre, 26),
  };
  const ops = Array.isArray(d.opciones) ? d.opciones : [];
  const llenar = (txt)=> txt
    .replace(/\{\{f:(\w+)\}\}/g, (_, k)=> valores[k] ?? enBlanco(''))
    .replace('{{transfusion}}', `${marca(d.transfusion==='Acepto')} Acepto | ${marca(d.transfusion==='Rechazo')} Rechazo.`)
    .replace('{{imagen}}', `${marca(d.autorizaImagen==='Sí autorizo')} SÍ AUTORIZO el uso anónimo de mis imágenes clínicas | ${marca(d.autorizaImagen==='No autorizo')} NO AUTORIZO el uso en redes sociales.`)
    .replace(/\{\{op:([AB])\}\}/, (_, o)=> ops.some(x=>x.startsWith('Opción '+o)) ? '[X]' : '[  ]');
  const textoCampo = { dx: d.diagnostico, proc: d.procedimiento, motivo: d.motivo };
  const out = [];
  c.blocks.forEach(b=>{
    if(b.t==='campo'){
      const v = (textoCampo[b.v]||'').trim();
      if(v) v.split('\n').filter(Boolean).forEach(l=> out.push({t:'p', v:l}));
      else out.push({t:'p', v:'_'.repeat(78)}, {t:'p', v:'_'.repeat(78)});
    } else if(b.t==='ul') out.push({t:'ul', v:b.v.map(llenar)});
    else out.push({t:b.t, v:llenar(b.v)});
  });
  if(c.ref) out.push({t:'p', v:c.ref});
  return out;
}

function computeImageAspect(dataUrl, aspectKey, onDone){
  const img = new Image();
  img.onload = ()=>{
    if(img.naturalWidth && img.naturalHeight){
      const aspect = img.naturalWidth/img.naturalHeight;
      localStorage.setItem(aspectKey, aspect);
      onDone(aspect);
    }
  };
  img.src = dataUrl;
}

const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

/* ===================== MEMORIA (diagnósticos / cirugías frecuentes) ===================== */
function getMemory(listName){
  try{ return JSON.parse(localStorage.getItem('mem_'+listName)||'[]'); }catch(e){ return []; }
}
function saveToMemory(listName, value){
  if(!value) return;
  value = value.trim();
  if(!value) return;
  const list = getMemory(listName);
  const idx = list.findIndex(x=>x.toLowerCase()===value.toLowerCase());
  if(idx>-1) list.splice(idx,1);
  list.unshift(value);
  if(list.length>200) list.length=200;
  localStorage.setItem('mem_'+listName, JSON.stringify(list));
}
function fmtFechaLarga(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-').map(Number);
  if(!y||!m||!d) return iso;
  return `${d} de ${MESES[m-1]} de ${y}`;
}
function addDaysISO(iso, days){
  if(!iso || days==null || days==='' || isNaN(days)) return '';
  const [y,m,d] = iso.split('-').map(Number);
  if(!y||!m||!d) return '';
  const date = new Date(Date.UTC(y, m-1, d));
  date.setUTCDate(date.getUTCDate() + Number(days));
  const yy = date.getUTCFullYear();
  const mm = String(date.getUTCMonth()+1).padStart(2,'0');
  const dd = String(date.getUTCDate()).padStart(2,'0');
  return `${yy}-${mm}-${dd}`;
}
function fmtFechaCorta(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  if(!y||!m||!d) return iso;
  return `${d}/${m}/${y}`;
}
function parseDDMMYYYY(str){
  const m = String(str||'').match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if(!m) return '';
  const dd = m[1], mm = m[2], yyyy = m[3];
  const d = Number(dd), mo = Number(mm), y = Number(yyyy);
  if(mo<1||mo>12||d<1||d>31||y<1900||y>2100) return '';
  return `${yyyy}-${mm}-${dd}`;
}
function maskDateInput(el){
  const digits = el.value.replace(/\D/g,'').slice(0,8);
  let formatted = digits;
  if(digits.length > 4) formatted = digits.slice(0,2)+'/'+digits.slice(2,4)+'/'+digits.slice(4);
  else if(digits.length > 2) formatted = digits.slice(0,2)+'/'+digits.slice(2);
  el.value = formatted;
}
function fmtHora12(t){
  if(!t) return '';
  let [h,m] = t.split(':').map(Number);
  if(isNaN(h)||isNaN(m)) return t;
  const ampm = h>=12 ? 'p.m.' : 'a.m.';
  h = h%12; if(h===0) h=12;
  return `${h}:${String(m).padStart(2,'0')} ${ampm}`;
}
function todayISO(){ const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); } // fecha local, no UTC
function normalizeAccents(s){
  return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
}
const NSQIP_ESPECIALISTAS = [
  ['fernando','valerio'],
  ['gabriela','turcios'],
  ['nigel','rodriguez'],
  ['martinez','schweinfurth'],
];
function especialistaSolicitaNSQIP(nombreEspecialista){
  const n = normalizeAccents(nombreEspecialista);
  return NSQIP_ESPECIALISTAS.some(parts => parts.every(p => n.includes(p)));
}
function bodyToEditableText(paras){
  return paras.map(p=>{
    if(p.t==='h2') return '## '+p.v;
    if(p.t==='h3') return '### '+p.v;
    if(p.t==='ul') return p.v.map(x=>'- '+x).join('\n');
    return p.v;
  }).join('\n\n');
}

function editableTextToBody(text){
  const blocks = String(text||'').split(/\n\s*\n/);
  const paras = [];
  blocks.forEach(block=>{
    const trimmed = block.trim();
    if(!trimmed) return;
    const lines = trimmed.split('\n').map(l=>l.trim()).filter(Boolean);
    if(lines.length && lines.every(l=>l.startsWith('- '))){
      paras.push({t:'ul', v: lines.map(l=>l.slice(2))});
      return;
    }
    if(lines.length===1 && lines[0].startsWith('## ')){
      paras.push({t:'h2', v: lines[0].slice(3)});
      return;
    }
    if(lines.length===1 && lines[0].startsWith('### ')){
      paras.push({t:'h3', v: lines[0].slice(4)});
      return;
    }
    paras.push({t:'p', v: lines.join(' ')});
  });
  return paras;
}

function checkedItems(d, key, otroKey){
  const arr = Array.isArray(d[key]) ? d[key].slice() : [];
  if(otroKey && d[otroKey]) arr.push('Otro: '+d[otroKey]);
  return arr.length ? arr : ['(sin marcar)'];
}

function applyCalcLinked(){
  if(!state.tpl || !state.tpl.calcLinked) return;
  state.tpl.calcLinked.forEach(c=>{
    const fecha = state.data[c.fromDate];
    const dias = state.data[c.fromDias];
    if(fecha && dias){
      state.data[c.toFin] = addDaysISO(fecha, Number(dias)-1);
      state.data[c.toRetorno] = addDaysISO(fecha, Number(dias));
    } else {
      state.data[c.toFin] = '';
      state.data[c.toRetorno] = '';
    }
  });
}

function fieldHTML(f, val){
  const v = val==null?'':val;
  if(f.type==='textarea'){
    return `<textarea data-key="${f.key}" placeholder="${f.placeholder||''}">${escapeHTML(v)}</textarea>`;
  }
  if(f.type==='select'){
    let optsHTML;
    if(f.groups){
      optsHTML = f.groups.map(g=>`<optgroup label="${escapeHTML(g.label)}">${g.options.map(o=>`<option value="${escapeHTML(o)}" ${o===v?'selected':''}>${escapeHTML(o)}</option>`).join('')}</optgroup>`).join('');
    } else {
      optsHTML = f.options.map(o=>`<option value="${escapeHTML(o)}" ${o===v?'selected':''}>${escapeHTML(o)}</option>`).join('');
    }
    return `<select data-key="${f.key}"><option value="">Elegir…</option>${optsHTML}</select>`;
  }
  if(f.type==='checkboxes'){
    const selected = Array.isArray(val) ? val : [];
    const boxes = f.options.map(o=>`
      <label style="display:flex;align-items:flex-start;gap:8px;padding:8px 0;font-size:14px;border-bottom:1px solid var(--line);">
        <input type="checkbox" data-checkgroup="${f.key}" value="${escapeHTML(o)}" ${selected.includes(o)?'checked':''} style="margin-top:3px;">
        <span>${escapeHTML(o)}</span>
      </label>`).join('');
    let otherHTML = '';
    if(f.allowOther){
      otherHTML = `<input type="text" data-key="${f.key}Otro" value="${escapeHTML(state.data[f.key+'Otro']||'')}" placeholder="Otro (especificar)" style="margin-top:8px;">`;
    }
    return `<div>${boxes}</div>${otherHTML}`;
  }
  if(f.type==='date'){
    const displayVal = v ? fmtFechaCorta(v) : '';
    if(f.calculated){
      return `<input type="text" data-key="${f.key}" value="${escapeHTML(displayVal)}" readonly style="background:#F0F2F5;color:var(--ink-soft);" placeholder="Se calcula solo">`;
    }
    return `<input type="text" inputmode="numeric" data-key="${f.key}" data-datefield="1" value="${escapeHTML(displayVal)}" placeholder="DD/MM/AAAA" maxlength="10">`;
  }
  const type = f.type==='number'?'number':(f.type==='time'?'time':'text');
  if(f.memory){
    return `<input type="${type}" data-key="${f.key}" data-memory="${f.memory}" value="${escapeHTML(v)}" placeholder="${f.placeholder||''}" list="dl_${f.memory}" autocomplete="off">`;
  }
  if(f.calculated){
    return `<input type="${type}" data-key="${f.key}" value="${escapeHTML(v)}" readonly style="background:#F0F2F5;color:var(--ink-soft);" placeholder="Se calcula solo">`;
  }
  return `<input type="${type}" data-key="${f.key}" value="${escapeHTML(v)}" placeholder="${f.placeholder||''}">`;
}

    <div class="backbar"><button class="backbtn" id="btnBack">← Inicio</button></div>

    <div class="empty">${state.accessToken ? 'Elija su hoja de pacientes en Ajustes › Conexión con Google para ver el historial.' : 'Conecte Google para ver el historial de constancias generadas en todos sus dispositivos.'}</div>`;
  }
  if(state.historyRows===null){
    return `
    <div class="backbar"><button class="backbtn" id="btnBack">← Inicio</button></div>
    <h2 class="screentitle">Historial</h2>
    <div class="empty">Cargando…</div>`;
  }
  if(state.historyRows.length===0){
    return `
    <div class="backbar"><button class="backbtn" id="btnBack">← Inicio</button></div>
    <h2 class="screentitle">Historial</h2>
    <div class="empty">Todavía no ha generado ninguna constancia.</div>`;
  }
  return `
  <div class="backbar"><button class="backbtn" id="btnBack">← Inicio</button></div>
  <h2 class="screentitle">Historial</h2>
  <div style="height:10px"></div>
  <input type="text" id="historySearchInput" placeholder="Buscar por paciente, tipo o fecha…" autocomplete="off">
  <div style="height:14px"></div>
  <div id="historyList">${renderHistoryItems(state.historyRows)}</div>`;
}

function renderHistoryItems(rows){
  if(rows.length===0) return `<div class="empty">Sin resultados.</div>`;
  return rows.slice().reverse().map(r=>{
    const idx = state.historyRows.indexOf(r);
    return `
    <div class="hist-item">
      <div>
        <div class="hi-t">${escapeHTML(r.tipo)}</div>
        <div class="hi-n">${escapeHTML(r.nombre||'—')}</div>
        <div class="hi-d">${escapeHTML(r.fecha)}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end;">
        ${r.driveLink ? `<a href="${escapeHTML(r.driveLink)}" target="_blank" rel="noopener" style="font-size:12px;color:var(--accent);text-decoration:underline;">Ver en Drive</a>` : ''}
        <button data-hist="${idx}">Reimprimir</button>
      </div>
    </div>`;
  }).join('');
}

function filterHistory(q){
  q = (q||'').trim().toLowerCase();
  if(!q) return state.historyRows;
  return state.historyRows.filter(r =>
    (r.nombre||'').toLowerCase().includes(q) ||
    (r.tipo||'').toLowerCase().includes(q) ||
    (r.fecha||'').toLowerCase().includes(q)
  );
}

function escapeHTML(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function doPatientSearch(q){
  const box = document.getElementById('searchResults');
  if(!box) return;
  q = (q||'').trim().toLowerCase();
  if(q.length<2 || !state.patients){ box.innerHTML=''; return; }
  const matches = state.patients.filter(p =>
    (p.nombre||'').toLowerCase().includes(q) || (p.dni||'').toLowerCase().includes(q)
  ).slice(0,8);
  box.innerHTML = matches.length ? `<div class="search-results">${matches.map((p,i)=>`
    <div class="search-item" data-pidx="${state.patients.indexOf(p)}"><b>${escapeHTML(p.nombre)}</b> — <span>DNI ${escapeHTML(p.dni||'—')}, ${escapeHTML(p.edad||'—')} años</span></div>
  `).join('')}</div>` : `<div class="footnote" style="margin-top:8px;">Sin resultados. Puede usar «Nuevo paciente».</div>`;

  box.querySelectorAll('[data-pidx]').forEach(el=>{
    el.onclick = ()=>{
      const p = state.patients[parseInt(el.dataset.pidx,10)];
      applyPatient(p);
    };
  });
}

function applyPatient(p){
  state.tpl.fields.forEach(f=>{
    if(f.autofill==='nombre') state.data[f.key]=p.nombre||'';
    if(f.autofill==='dni') state.data[f.key]=p.dni||'';
    if(f.autofill==='edad') state.data[f.key]=p.edad||'';
    if(f.autofill==='diagnostico') state.data[f.key]=p.diagnostico||'';
  });
  state.data.__patientLabel = p.nombre + (p.dni?` · DNI ${p.dni}`:'');
  state.patientMode='search';
  render();
}

/* ===================== TOAST ===================== */
let toastTimer=null;
function toast(msg, kind){
  let el = document.querySelector('.toast');
  if(el) el.remove();
  el = document.createElement('div');
  el.className = 'toast'+(kind?' '+kind:'');
  el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.remove(), 3800);
}

/* ===================== GOOGLE AUTH ===================== */
function initGoogle(){
  if(!window.google || !google.accounts) { setTimeout(initGoogle, 300); return; }
  state.tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: SCOPES,
    callback: (resp)=>{
      if(resp.error){ toast('No se pudo conectar con Google.', 'err'); return; }
      state.accessToken = resp.access_token;
      render();
      if(!state.sheetId){
        toast('Google conectado. Elija su hoja de pacientes.', 'warn');
        state.screen = 'google'; render();
        return;
      }
      toast('Google conectado');
      loadSheetData();
    }
  });
}
window.addEventListener('load', initGoogle);

function connectGoogle(){
  if(GOOGLE_CLIENT_ID.startsWith('PON_AQUI')){
    toast('Falta configurar el ID de cliente de Google en el código.', 'warn');
    return;
  }
  if(!state.tokenClient){ toast('Google todavía está cargando, intente de nuevo en un momento.', 'warn'); return; }
  state.tokenClient.requestAccessToken({prompt: state.accessToken?'':'consent'});
}

async function sheetsFetch(path, opts){
  opts = opts||{};
  opts.headers = Object.assign({Authorization:'Bearer '+state.accessToken, 'Content-Type':'application/json'}, opts.headers||{});
  if(!state.sheetId) throw new Error('no_sheet');
  const res = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${state.sheetId}${path}`, opts);
  if(res.status===401){
    state.accessToken = null;
    render();
    throw new Error('token_expired');
  }
  if(!res.ok) throw new Error('sheets_error_'+res.status);
  return res.json();
}

function loadSheetData(){
  loadSheetTabs().then(()=>{ loadPatients(); if(state.screen==='google') render(); }).catch(e=>{
    console.error(e);
    toast(e.message==='sheets_error_404' || e.message==='sheets_error_403' ? 'No hay acceso a la hoja elegida: elíjala otra vez en Ajustes › Conexión con Google.' : 'No se pudo leer la hoja de pacientes.', 'warn');
  });
  loadSpecialistsFromSheet();
  loadConfigFromSheet();
}

// Pestaña de pacientes: la guardada; si es de un año y ya existe la del año en curso, la del año en curso.
function choosePatientsTab(titles, saved){
  const own = titles.filter(t=>![HISTORY_TAB, SPECIALISTS_TAB, CONFIG_TAB].includes(t));
  const year = String(new Date().getFullYear());
  if(saved && own.includes(saved) && !(/^\d{4}$/.test(saved) && saved !== year && own.includes(year))) return saved;
  if(own.includes(year)) return year;
  return own[0] || null;
}

async function loadSheetTabs(){
  const meta = await sheetsFetch('?fields=sheets.properties.title');
  state.sheetTabs = (meta.sheets||[]).map(s=>s.properties.title);
  state.patientsTab = choosePatientsTab(state.sheetTabs, state.patientsTab);
  if(state.patientsTab) localStorage.setItem('patients_tab', state.patientsTab);
}

function pickSheet(){
  if(!state.apiKey){ toast('Primero pegue la clave de API (paso 1).', 'warn'); return; }
  if(!state.accessToken){ toast('Conecte Google primero.', 'warn'); connectGoogle(); return; }
  if(!window.gapi){ toast('Google todavía está cargando, intente de nuevo.', 'warn'); return; }
  const open = ()=>{
    const view = new google.picker.DocsView(google.picker.ViewId.SPREADSHEETS).setMode(google.picker.DocsViewMode.LIST);
    new google.picker.PickerBuilder()
      .setAppId(GOOGLE_APP_ID)
      .setOAuthToken(state.accessToken)
      .setDeveloperKey(state.apiKey)
      .setTitle('Elija su lista de pacientes')
      .addView(view)
      .setCallback(data=>{
        if(data.action !== google.picker.Action.PICKED || !data.docs || !data.docs[0]) return;
        const doc = data.docs[0];
        state.sheetId = doc.id; state.sheetName = doc.name || '';
        localStorage.setItem('patients_sheet_id', state.sheetId);
        localStorage.setItem('patients_sheet_name', state.sheetName);
        state.patientsTab = null; state.sheetTabs = null; state.patients = null; state.historyRows = null;
        localStorage.removeItem('patients_tab');
        toast('Hoja elegida: '+state.sheetName);
        loadSheetData();
        render();
      })
      .build().setVisible(true);
  };
  if(window.google && google.picker) open(); else gapi.load('picker', open);
}

/* ===================== GOOGLE DRIVE ===================== */
const driveFolderCache = {};

async function ensureDriveRootFolder(){
  let folderId = localStorage.getItem('driveFolderId');
  if(folderId) return folderId;
  const q = encodeURIComponent(`name='${DRIVE_FOLDER_NAME}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`, {
    headers: {Authorization:'Bearer '+state.accessToken}
  });
  if(!res.ok) throw new Error('drive_search_'+res.status);
  const json = await res.json();
  if(json.files && json.files.length){
    folderId = json.files[0].id;
  } else {
    const createRes = await fetch('https://www.googleapis.com/drive/v3/files', {
      method:'POST',
      headers: {Authorization:'Bearer '+state.accessToken, 'Content-Type':'application/json'},
      body: JSON.stringify({name: DRIVE_FOLDER_NAME, mimeType:'application/vnd.google-apps.folder'})
    });
    if(!createRes.ok) throw new Error('drive_create_'+createRes.status);
    const createJson = await createRes.json();
    folderId = createJson.id;
  }
  localStorage.setItem('driveFolderId', folderId);
  return folderId;
}

async function ensureSubfolder(parentId, name){
  const cacheKey = parentId+'::'+name;
  if(driveFolderCache[cacheKey]) return driveFolderCache[cacheKey];
  const safeName = name.replace(/'/g, "\\'");
  const q = encodeURIComponent(`name='${safeName}' and mimeType='application/vnd.google-apps.folder' and trashed=false and '${parentId}' in parents`);
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`, {
    headers: {Authorization:'Bearer '+state.accessToken}
  });
  if(!res.ok) throw new Error('drive_search_'+res.status);
  const json = await res.json();
  let id;
  if(json.files && json.files.length){
    id = json.files[0].id;
  } else {
    const createRes = await fetch('https://www.googleapis.com/drive/v3/files', {
      method:'POST',
      headers: {Authorization:'Bearer '+state.accessToken, 'Content-Type':'application/json'},
      body: JSON.stringify({name, mimeType:'application/vnd.google-apps.folder', parents:[parentId]})
    });
    if(!createRes.ok) throw new Error('drive_create_'+createRes.status);
    const createJson = await createRes.json();
    id = createJson.id;
  }
  driveFolderCache[cacheKey] = id;
  return id;
}

async function ensureDrivePatientFolder(year, patientName){
  const root = await ensureDriveRootFolder();
  const yearFolder = await ensureSubfolder(root, String(year));
  const safePatient = String(patientName||'').trim() || 'Sin nombre';
  return ensureSubfolder(yearFolder, safePatient);
}

async function uploadPDFToDrive(doc, filename){
  if(!state.accessToken) return null;
  try{
    const t = state.tpl, d = state.data;
    const nombreField = (t.fields||[]).find(f=>f.autofill==='nombre');
    const nombre = (nombreField ? d[nombreField.key] : d.nombre) || 'Sin nombre';
    const fechaBase = d.__fecha || d.fechaExtendida || todayISO();
    const year = (String(fechaBase).split('-')[0]) || String(new Date().getFullYear());
    const folderId = await ensureDrivePatientFolder(year, nombre);
    const pdfBlob = doc.output('blob');
    const pdfBuffer = await pdfBlob.arrayBuffer();
    const metadata = {name: filename, parents:[folderId], mimeType:'application/pdf'};
    const boundary = 'constancias_boundary_' + Date.now();
    const delimiter = `\r\n--${boundary}\r\n`;
    const closeDelim = `\r\n--${boundary}--`;
    const metaPart = delimiter + 'Content-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify(metadata);
    const filePartHeader = delimiter + 'Content-Type: application/pdf\r\n\r\n';
    const body = new Blob([metaPart, filePartHeader, pdfBuffer, closeDelim]);
    const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
      method:'POST',
      headers: {Authorization:'Bearer '+state.accessToken, 'Content-Type':'multipart/related; boundary='+boundary},
      body
    });
    if(!res.ok) throw new Error('drive_upload_'+res.status);
    const json = await res.json();
    return `https://drive.google.com/file/d/${json.id}/view`;
  }catch(e){
    console.error(e);
    return null;
  }
}

        edad: iEdad>-1?(r[iEdad]||''):'', diagnostico: iDx>-1?(r[iDx]||''):'',

}

// «Compartir PDF» abre el menú de compartir del teléfono con el PDF adjunto (ahí aparece WhatsApp).
// Donde el navegador no puede adjuntar archivos, se descarga el PDF y se abre WhatsApp con el texto.
let modoEntrega = 'descargar';
function mensajeCompartir(){
  const t = state.tpl, d = state.data;
  const nombreField = (t.fields||[]).find(f=>f.autofill==='nombre');
  const nombre = (nombreField ? d[nombreField.key] : d.nombre) || '';
  return `${t.title}${nombre ? ' — '+nombre : ''}\n\nLe adjunto el documento en PDF.\n\nDr. Manuel Salinas, Cirujano Oncólogo`;
}
function entregarPDF(doc, fname){
  if(modoEntrega !== 'compartir'){ doc.save(fname); return; }
  const file = new File([doc.output('blob')], fname, {type:'application/pdf'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file], title:fname, text:mensajeCompartir()}).catch(e=>{
      if(e && e.name === 'AbortError') return;
      doc.save(fname); toast('No se pudo compartir; el PDF se descargó.', 'warn');
    });
    return;
  }
  doc.save(fname);
  window.open('https://wa.me/?text='+encodeURIComponent(mensajeCompartir()), '_blank');
  toast('Este navegador no adjunta archivos: el PDF se descargó; adjúntelo en WhatsApp.', 'warn');
}

function generateLetterPDF(){
  const t = state.tpl, d = state.data;

  const nombreField = t.fields.find(f=>f.autofill==='nombre');
  if(nombreField && !d[nombreField.key]){
    toast('Falta el nombre del paciente.', 'warn');
    return;
  }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'in', format:'letter'});
  const marginL = 1, marginR = 1, width = 8.5-marginL-marginR;
  // Hoja membretada (si está elegida): va de fondo en cada página y el texto se acomoda en su espacio blanco.
  const memb = msMembrete();
  const Y0 = memb ? memb.top : 0.9;
  const LIM = memb ? 11 - memb.bottom : 10.4;
  const fondo = ()=>{ if(memb){ try{ doc.addImage(memb.img, 'JPEG', 0, 0, 8.5, 11, 'membrete'); }catch(e){ console.error('membrete', e); } } };
  const nuevaPagina = ()=>{ doc.addPage(); fondo(); return Y0; };
  // Dibuja el documento completo desde la página actual (los consentimientos se dibujan dos veces).
  const dibujar = ()=>{
    let y = Y0;

    if(!memb && state.logoDataUrl){
      // Logo centrado, hasta 2.8 × 1.25 pulgadas; un banner alargado (≥ 3.5:1) ocupa todo el ancho del texto.
      const aspect = state.logoAspect || 2.5;
      const banner = aspect >= 3.5;
      const maxW = banner ? width : 2.8, maxH = banner ? 1.6 : 1.25;
      let w = maxW, h = w/aspect;
      if(h > maxH){ h = maxH; w = h*aspect; }
      const fmt = state.logoDataUrl.includes('image/png') ? 'PNG' : 'JPEG';
      try{ doc.addImage(state.logoDataUrl, fmt, 4.25 - w/2, y-0.15, w, h); }catch(e){ console.error('logo error', e); }
      y += h + 0.15;
    }

    doc.setFont('helvetica','normal');

    if(!memb) headerLines().forEach(l=>{
      doc.setFont('helvetica', l.nombre ? 'bold' : 'normal'); doc.setFontSize(l.nombre ? 11 : 10);
      doc.text(l.v, 4.25, y, {align:'center'}); y += l.nombre ? 0.21 : 0.19;
    });
    doc.setFont('helvetica','normal'); doc.setFontSize(10);
    y += 0.05;
    doc.text(fmtFechaCorta(d.__fecha)||fmtFechaCorta(todayISO()), marginL, y);
    y += 0.4;

    if(t.docTitle){
      doc.setFont('helvetica','bold'); doc.setFontSize(12);
      const titleLines = doc.splitTextToSize(t.docTitle, width);
      titleLines.forEach(line=>{ doc.text(line, 4.25, y, {align:'center'}); y += 0.22; });
      doc.setFont('helvetica','normal');
      y += 0.13;
    }
    if(t.addressee){
      doc.setFont('helvetica','bold'); doc.setFontSize(11);
      const lines = doc.splitTextToSize(t.addressee(d), width);
      doc.text(lines, marginL, y); y += lines.length*0.2 + 0.15;
      doc.setFont('helvetica','normal');
    }

    doc.setFontSize(10.5);
    (d.__editedBody ? editableTextToBody(d.__editedBody) : t.body(d)).forEach(p=>{
      if(p.t==='p'){
        doc.setFont('helvetica','normal');
        const lines = doc.splitTextToSize(p.v, width);
        if(y + lines.length*0.2 > LIM-0.2){ y=nuevaPagina(); }
        doc.text(lines, marginL, y);
        y += lines.length*0.2 + 0.14;
      } else if(p.t==='ul'){
        doc.setFont('helvetica','normal');
        p.v.forEach(item=>{
          const lines = doc.splitTextToSize('•  '+item, width-0.15);
          if(y + lines.length*0.2 > LIM-0.2){ y=nuevaPagina(); }
          doc.text(lines, marginL+0.15, y);
          y += lines.length*0.2 + 0.05;
        });
        y += 0.1;
      } else if(p.t==='h2'){
        if(y > LIM-0.8){ y=nuevaPagina(); }
        doc.setFont('helvetica','bold'); doc.setFontSize(11.5);
        const lines = doc.splitTextToSize(p.v, width);
        doc.text(lines, marginL, y);
        y += lines.length*0.22 + 0.12;
        doc.setFont('helvetica','normal'); doc.setFontSize(10.5);
      } else if(p.t==='h3'){
        if(y > LIM-0.7){ y=nuevaPagina(); }
        doc.setFont('helvetica','bold'); doc.setFontSize(10.5);
        const lines = doc.splitTextToSize(p.v, width);
        doc.text(lines, marginL, y);
        y += lines.length*0.2 + 0.08;
        doc.setFont('helvetica','normal'); doc.setFontSize(10.5);
      }
    });

    y += 0.4;
    const useElectronicSig = t.electronicSignature && state.signatureDataUrl && !t.signatureBlocks;
    if(useElectronicSig){
      if(y + 1.1 > LIM){ y=nuevaPagina(); }
      doc.setFont('helvetica','normal'); doc.setFontSize(10);
      doc.text('Atte.', marginL, y); y += 0.22;
      const maxW = 1.6, maxH = 0.55;
      const aspect = state.signatureAspect || 2.5;
      let sw = maxW, sh = sw/aspect;
      if(sh > maxH){ sh = maxH; sw = sh*aspect; }
      const sigFmt = state.signatureDataUrl.includes('image/png') ? 'PNG' : 'JPEG';
      try{ doc.addImage(state.signatureDataUrl, sigFmt, marginL, y-0.05, sw, sh); }catch(e){ console.error('signature error', e); }
      y += sh + 0.08;
      doc.text('Dr. Manuel Salinas', marginL, y); y += 0.2;
      doc.text('Cirujano Oncólogo', marginL, y); y += 0.2;
    } else {
      const sigBlocks = t.signatureBlocks ? t.signatureBlocks : [SIGNATURE_LINES];
      const colWidth = width/sigBlocks.length;
      const maxLines = Math.max(...sigBlocks.map(b=>b.length));
      if(y + maxLines*0.2 > LIM){ y=nuevaPagina(); }
      doc.setFont('helvetica','normal'); doc.setFontSize(10);
      sigBlocks.forEach((block, i)=>{
        let sy = y;
        block.forEach(l=>{ doc.text(l, marginL + i*colWidth, sy); sy+=0.2; });
      });
      y += maxLines*0.2;
    }
  };
  // Consentimientos: dos juegos en el mismo PDF (paciente y expediente), cada página marcada con su copia.
  const copias = t.dosCopias ? ['Copia para el paciente', 'Copia para el médico (expediente)'] : [null];
  const tramos = [];
  copias.forEach((c, i)=>{
    if(i) doc.addPage();
    fondo();
    const ini = doc.getNumberOfPages();
    dibujar();
    tramos.push([c, ini, doc.getNumberOfPages()]);
  });
  if(t.dosCopias) tramos.forEach(([c, a, b])=>{
    for(let pg = a; pg <= b; pg++){
      doc.setPage(pg);
      doc.setFont('helvetica','italic'); doc.setFontSize(8.5);
      doc.text(`${c} · Página ${pg-a+1} de ${b-a+1}`, 4.25, memb ? LIM + 0.15 : 10.6, {align:'center'});
    }
    doc.setFont('helvetica','normal');
  });

  const fnameFecha = d.__fecha || todayISO();
  const fname = `${fnameFecha}_${t.title.replace(/[^\wáéíóúñÁÉÍÓÚÑ ]/g,'').trim().replace(/\s+/g,'_')}_${(d.nombre||d.nombrePaciente||d.nombreCompleto||'paciente').replace(/\s+/g,'_')}.pdf`;
  entregarPDF(doc, fname);

  const nombre = d.nombre||d.nombrePaciente||d.nombreCompleto||'';
  if(state.accessToken){
    toast('PDF generado ✓ — guardando en Drive…');
    uploadPDFToDrive(doc, fname).then(driveLink=>{
      saveToHistory(t.n+'. '+t.title, nombre, d, driveLink);
      toast(driveLink ? 'Guardado en su Drive ✓' : 'PDF descargado, pero no se pudo guardar en Drive.', driveLink?undefined:'warn');
    });
  } else {
    saveToHistory(t.n+'. '+t.title, nombre, d, null);
    toast('PDF generado ✓');
  }
}

function generateCMHPDF(){
  const t = state.tpl, d = state.data;
  if(!d.nombre){ toast('Falta el nombre del paciente.', 'warn'); return; }
  const tune = JSON.parse(localStorage.getItem('cmhOffset')||'{"dx":0,"dy":0}');
  const dx = tune.dx||0, dy = tune.dy||0;

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'in', format:'letter'});
  doc.setFont('times','normal');
  doc.setFontSize(11);

  // Colegiado No. — fijo
  doc.text('6414', 5.45+dx, 3.79+dy);

  // Campos del formulario, cada uno en su posición medida sobre el papel
  t.fields.forEach(f=>{
    if(!f.cmhPos) return;
    let val = d[f.key] || '';
    if(f.key==='fechaExtendida'){
      val = 'San Pedro Sula, ' + (val ? fmtFechaCorta(val) : '');
    }
    if(!val) return;
    doc.text(String(val), f.cmhPos.x+dx, f.cmhPos.y+dy);
  });

  // Cuerpo de la constancia, en el espacio en blanco debajo del formulario
  const marginL = 0.55, marginR = 0.55, width = 8.5-marginL-marginR;
  let y = 7.35+dy;
  doc.setFontSize(11);
  doc.text('A quien interese', marginL+dx, y); y += 0.32;

  const parrafo = cmhParrafo(d);
  const lines = doc.splitTextToSize(parrafo, width);
  if(y + lines.length*0.22 > 10.4){ doc.addPage(); y = 0.9; }
  doc.text(lines, marginL+dx, y);

  const cmhFnameFecha = d.fechaExtendida || todayISO();
  const cmhFname = cmhFnameFecha+'_Constancia_CMH_'+String(d.nombre).replace(/\s+/g,'_')+'.pdf';
  entregarPDF(doc, cmhFname);

  if(state.accessToken){
    toast('PDF generado ✓ — guardando en Drive…');
    uploadPDFToDrive(doc, cmhFname).then(driveLink=>{
      saveToHistory(t.n+'. '+t.title, d.nombre||'', d, driveLink);
      toast(driveLink ? 'Guardado en su Drive ✓ — imprima sobre el papel del Colegio Médico' : 'PDF descargado, pero no se pudo guardar en Drive.', driveLink?undefined:'warn');
    });
  } else {
    saveToHistory(t.n+'. '+t.title, d.nombre||'', d, null);
    toast('PDF generado ✓ — imprima sobre el papel del Colegio Médico');
  }
}
