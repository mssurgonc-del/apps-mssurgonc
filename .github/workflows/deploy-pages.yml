name: Deploy apps to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: calculadora-ata/package-lock.json
      - name: Build calculadora-ata
        working-directory: calculadora-ata
        run: npm ci && npm test && npm run build
      - name: Assemble site
        run: |
          mkdir -p site/calculadora-ata
          cp -r calculadora-ata/dist/. site/calculadora-ata/
          mkdir -p site/alta-quirurgica
          cp alta-quirurgica/index.html site/alta-quirurgica/index.html
          cp index.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
