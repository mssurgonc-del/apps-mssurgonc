name: Pruebas del motor clínico

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: calculadora-ata/package-lock.json
      - name: Pruebas y compilación
        working-directory: calculadora-ata
        run: npm ci && npm test && npm run build
